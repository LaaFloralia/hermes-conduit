# xcodegen overlay for the LAA build — the fork's own paid-team app, delivered
# by TestFlight. `scripts/laa/testflight.sh` generates it, archives and
# uploads; this file is the only build path for it.
#
#   xcodegen generate --spec project-laa.yml
#   xcodebuild archive -project Conduit.xcodeproj -scheme Conduit ...
#
# The app alone under the LAA team (PAW258GB42), display name "LAA", bundle
# IDs under com.laa-inc.laa and the LAA App Groups, signed automatically.
# Everything upstream is untouched: the App Store app keeps its own bundle
# IDs, group, entitlements and relay.
#
# Left out, and why:
#   - CarPlay voice-based conversation and the Location Push service
#     extension: both entitlements are granted by Apple on request, which this
#     account doesn't have (Conduit.entitlements, scripts/laa/entitlements).
#   - ConduitLocationPush: the extension exists only for that entitlement, so
#     the app no longer embeds it. It stays in the project spec (xcodegen
#     keeps every target an include declares) but nothing builds it.
# HealthKit is kept: it is a self-service capability the team's App ID can
# hold, and automatic signing adds it.
include:
  - path: project.yml
settings:
  base:
    DEVELOPMENT_TEAM: PAW258GB42
    CODE_SIGN_STYLE: Automatic
    # The App Groups the LAA App IDs hold (group.com.laa-inc.laa.*). Each
    # Info.plist passes them to the code that opens the container, and
    # scripts/laa/entitlements names the same groups.
    CONDUIT_NOTIFICATION_APP_GROUP: group.com.laa-inc.laa.notifications
    CONDUIT_LAUNCHER_APP_GROUP: group.com.laa-inc.laa.launcher
    # The LAA push relay (scripts/laa/relay-*.sh) — this Mac, published on the
    # tailnet only. It holds the LAA APNs key and pushes to the LAA bundle,
    # so a phone registers here instead of upstream's shared relay.
    CONDUIT_DEFAULT_RELAY_URL: https://mac-mini.tailc9b8e7.ts.net:9443
    # Xcode 27's build system refuses a target whose Info.plist is also a
    # copied resource ("Multiple commands produce .../Info.plist"), and this
    # spec hands each target its whole folder. Xcode 26 lets it through, which
    # is why project.yml doesn't carry this: without it, no archive of the full
    # app (Watch app and extensions included) gets past the build description.
    EXCLUDED_SOURCE_FILE_NAMES: Info.plist
targets:
  ConduitTests:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LAA_BUILD"
  ConduitUITests:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LAA_BUILD"
  Conduit:
    sources:
      - path: docs/laa/assets/staff
        type: folder
        buildPhase: resources
      - path: docs/laa/assets/ciel
        type: folder
        buildPhase: resources
      - path: docs/laa/assets/callkit-icon-template-120.png
        buildPhase: resources
    # The app embeds the Watch app and the three extensions that sign with
    # the LAA team; the Location Push extension is not among them.
    dependencies:REPLACE:
      - package: WebRTC
      - target: ConduitWatch
      - target: ConduitNotificationService
      - target: ConduitWidgets
      - target: ConduitShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laa-inc.laa
        # The LAA icon (design, on master): Conduit/Resources/AppIcon-LAA.icon,
        # an Icon Composer bundle for iOS 26+, with the matching appiconset in
        # Assets.xcassets as the fallback for older Xcode and OS versions. The
        # App Store build keeps upstream's AppIcon. The asset catalog compiler
        # rewrites Info.plist's legacy CFBundleIcons on its own — verified in
        # the built app: CFBundlePrimaryIcon.CFBundleIconName is AppIcon-LAA —
        # so no post-build step is needed.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-LAA
        # The five-tab shell (branch laa/tabs-07) compiles in only for this
        # build; the App Store app keeps the upstream navigation.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LAA_BUILD"
        CODE_SIGN_ENTITLEMENTS: scripts/laa/entitlements/Conduit.entitlements
        # Automatic signing: a named profile would be the App Store app's.
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Automatic signing chooses the profile; the identity has to be the
        # one it signs a device build with, and -exportArchive re-signs with
        # Apple Distribution for the store. Naming Apple Distribution here is
        # the "conflicting code signing identity" error, and naming nothing
        # leaves the archive unsigned — with no entitlements for export to
        # keep.
        CODE_SIGN_IDENTITY: "Apple Development"
    postBuildScripts:
      # The home screen name, beside the App Store Conduit.
      - name: LAA build name
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${CONDUIT_DISPLAY_NAME:-LAA}" "$plist"
  ConduitWatch:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laa-inc.laa.watchkitapp
        CODE_SIGN_ENTITLEMENTS: scripts/laa/entitlements/ConduitWatch.entitlements
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: "Apple Development"
        # Written by the script below from upstream's ConduitWatch/Info.plist.
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/LAA-Info.plist"
    preBuildScripts:
      # The Watch app names its phone app, and upstream's Info.plist says
      # com.milim.relay: App Store Connect refuses the upload ("Invalid
      # WKCompanionAppBundleIdentifier", 2026-10-29) and the simulator the
      # install unless it is this build's parent, com.laa-inc.laa. The copy
      # is made before Info.plist processing, so the phone app embeds the
      # right value; patching the built Info.plist afterwards raced that
      # embed in unsigned simulator builds.
      - name: LAA watch companion
        inputFiles:
          - "$(SRCROOT)/ConduitWatch/Info.plist"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/LAA-Info.plist"
        script: |
          mkdir -p "$DERIVED_FILE_DIR"
          cp "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
          /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier com.laa-inc.laa" "$SCRIPT_OUTPUT_FILE_0"
  ConduitWatchWidgets:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laa-inc.laa.watchkitapp.widgets
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: "Apple Development"
  ConduitNotificationService:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laa-inc.laa.NotificationService
        CODE_SIGN_ENTITLEMENTS: scripts/laa/entitlements/ConduitNotificationService.entitlements
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: "Apple Development"
  ConduitWidgets:
    sources:
      - path: ConduitWidgets/Resources/LAAStaff.xcassets
        buildPhase: resources
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LAA_BUILD"
        PRODUCT_BUNDLE_IDENTIFIER: com.laa-inc.laa.widgets
        CODE_SIGN_ENTITLEMENTS: scripts/laa/entitlements/ConduitWidgets.entitlements
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: "Apple Development"
  ConduitShareExtension:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laa-inc.laa.ShareExtension
        CODE_SIGN_ENTITLEMENTS: scripts/laa/entitlements/ConduitShareExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: "Apple Development"
