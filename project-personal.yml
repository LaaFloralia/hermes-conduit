# xcodegen overlay for the LAA fork's own-iPhone build:
# `scripts/laa/install-on-iphone.sh` generates it, signs it with your team
# and installs it.
#
# The iPhone app alone, signed automatically by your own team (a free Apple
# ID works; its builds expire after 7 days), installed beside the App Store
# Conduit: its own bundle ID and name, and none of the capabilities a
# personal team can't sign (push, app groups, HealthKit, CarPlay, location
# push). So no notifications, calls from Hermes, widgets or Watch here; the
# App Store app keeps those. The Watch app and the extensions are left out,
# as in project-tests.yml.
#
# Calls the user places from the app (CallKit, VoicePlacedCalls) need no
# capability or Info.plist key, so this build places them: UIBackgroundModes
# (audio, voip) and ConduitHermesCallsRing come unchanged from project.yml's
# Conduit/Info.plist. Nothing here changes for that.
include:
  - path: project.yml
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # Passed on the command line (DEVELOPMENT_TEAM=...) by the script.
    DEVELOPMENT_TEAM: ""
targets:
  Conduit:
    sources:
      - path: docs/laa/assets/staff
        type: folder
        buildPhase: resources
      - path: docs/laa/assets/ciel
        type: folder
        buildPhase: resources
      - path: docs/laa/assets/callkit-icon-template-120.png
        buildPhase: resources
    dependencies:REPLACE:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laa-inc.conduit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-LAA
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        # The LAA build's own screens (Conduit/LAA/: the five tabs of
        # docs/laa/DESIGN.md) are behind this flag, so the App Store build
        # from project.yml never compiles them and upstream stays unchanged.
        # The TestFlight signing overlay must adopt the same setting.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LAA_BUILD"
    postBuildScripts:
      - name: Brand LAA personal resources
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/laa/brand-bundle.py" --bundle "$TARGET_BUILD_DIR/$WRAPPER_NAME" --kind app --source "$SRCROOT"
